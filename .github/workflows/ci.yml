name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: spice-framework/.github/.github/workflows/go-verify.yml@0534fe1247f892b287f624b7abb6f2347765ab22
    with:
      go-version: 1.26.6

  quality:
    name: Repository quality contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Run complete local quality contract
        run: go run ./internal/qualitygate -mode=verify

  core-compatibility:
    name: Spice core (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        line: [minimum, current]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Verify the ${{ matrix.line }} core line
        run: go run ./internal/qualitygate -mode=compatibility -line=${{ matrix.line }}

  mailpit:
    name: Mailpit authenticated STARTTLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Start pinned Mailpit with required STARTTLS and authentication
        run: >-
          docker run --detach --name spice-mailpit
          --publish 1025:1025 --publish 8025:8025
          --env MP_SMTP_TLS_CERT=sans:localhost
          --env MP_SMTP_TLS_KEY=sans:localhost
          --env MP_SMTP_REQUIRE_STARTTLS=true
          --env MP_SMTP_AUTH=spice:integration-secret
          axllent/mailpit@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
      - name: Wait for Mailpit API
        shell: bash
        run: |
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8025/api/v1/info >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs spice-mailpit
          exit 1
      - name: Deliver and inspect through the real SMTP server
        env:
          SPICE_SMTP_ADDRESS: 127.0.0.1:1025
          SPICE_SMTP_API: http://127.0.0.1:8025
          SPICE_SMTP_USERNAME: spice
          SPICE_SMTP_PASSWORD: integration-secret
        run: go test -tags=integration -count=1 ./integration/...
      - name: Preserve Mailpit diagnostics
        if: always()
        run: docker logs spice-mailpit
      - name: Stop Mailpit
        if: always()
        run: docker rm --force spice-mailpit

  release-rehearsal:
    name: Release rehearsal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOWORK: 'off'
      GOPROXY: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=vendor
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - name: Prove deterministic central release rendering
        run: go run ./internal/qualitygate -mode=release-rehearsal

  required:
    name: Required CI
    if: always()
    needs: [verify, quality, core-compatibility, mailpit, release-rehearsal]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CORE_COMPATIBILITY_RESULT: ${{ needs.core-compatibility.result }}
          MAILPIT_RESULT: ${{ needs.mailpit.result }}
          RELEASE_REHEARSAL_RESULT: ${{ needs.release-rehearsal.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$CORE_COMPATIBILITY_RESULT" = "success"
          test "$MAILPIT_RESULT" = "success"
          test "$RELEASE_REHEARSAL_RESULT" = "success"
